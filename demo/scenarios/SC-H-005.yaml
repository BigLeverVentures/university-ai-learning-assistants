assignment_prompt: >
  HIST 210 weekly source-analysis worksheet, entry 7 (graded). Short response, about 150 words, on packet
  excerpt E (the July 1877 fines ledger page): what can this page tell us about workplace discipline at the
  Carrow Junction shops, and what can it not? Use the method in Reader unit 5.
source_texts:
  - ref: packet-1877-strike#E
    title: "Course packet excerpt E: Carrow Junction shops fines ledger, page for July 1877 (invented transcription)"
    text: >
      Carrow Junction Shops. Fines levied, July 1877. Clerk: W. Ashby. [Columns: date; name; shop;
      offence; amount.] July 2, Dunmore A., car shop, late 20 min., 25c. July 2, Kell M., machine,
      smoking in shop, 50c. July 5, Reese T., machine, insolence to foreman, $1.00. July 7, Dunmore
      A., car shop, late 15 min., 25c. July 9, Ott P., roundhouse, absent without leave, $1.00. July
      11, Kell M., machine, tools not returned, 25c. July 13, Reese T., machine, leaving bench, 50c.
      July 16, Dunmore A., car shop, late, 25c. July 18, Ott P., roundhouse, smoking, 50c. July 19,
      Reese T., machine, insolence, $1.00. July 20, Kell M., machine, late, 25c. July 21, [no entry].
      July 23 to July 28, [no entries; marginal note in a different hand: "shops idle"]. July 30, Ott
      P., roundhouse, absent, $1.00. July 31, Barrow H., car shop, late, 25c. Total for month, $7.25,
      carried forward. [Foot of page, same hand as the marginal note: "Reese, Dunmore—see Supt."]
  - ref: wrenfield-psr-u1-6#unit-5
    title: "Wrenfield Primary Source Reader, unit 5: Records and silences (invented)"
    text: >
      Administrative records—ledgers, registers, rolls—were not written to tell a story, and that is
      their value. A fines ledger records what a particular clerk was required to write down: a date,
      a name, a charge, an amount. It shows the rules a workplace enforced, who was caught under them,
      and how often. It cannot show who broke the rules unobserved, which offences were forgiven at
      the bench, or what the men fined thought about it. Read a ledger in two directions. Down the
      page: who appears, how often, for what. Across time: where do the entries thin out or stop, and
      what else was happening on those days? A page with no entries is not an empty page; it records
      that nobody was fined, which may mean nobody worked. Treat a silence as a fact to be explained,
      not as the absence of a fact. A good analysis of a record states what the record was for, what
      it shows about discipline, and what it is silent about—and keeps the three apart.
