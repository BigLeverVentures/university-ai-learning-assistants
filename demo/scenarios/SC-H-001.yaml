# --- Added 2026-11-01 for the CP-0001 model run. Status of this addition: design assumption.
# Every excerpt below is invented for the fictional Wrenfield University; none quotes a real document. ---
source_texts_status: design assumption
assignment_prompt: >
  HIST 210 weekly source-analysis worksheet, entry 3 (graded, 1 of 10 entries). For packet excerpt A, write:
  (a) one claim the editorial makes, in the editorial's words; (b) one piece of evidence the editorial offers
  for it, in your words; (c) one inference you draw, marked as yours. Three to five sentences in all.
source_texts:
  - ref: packet-1877-strike#A
    title: "Course packet excerpt A: Carrow Junction Evening Dispatch, editorial, 26 July 1877 (invented)"
    text: >
      THE STRIKE AND ITS AUTHORS.—The stoppage at the Carrow Junction shops, now entering its fourth
      day, has been represented in certain quarters as the spontaneous act of our working men. We do
      not believe it. The men of this town have had steady work at fair wages for the better part of a
      decade, and until Monday last we never heard a murmur against the Company. That they should down
      tools within an hour of the arrival of the eastern train, and that strangers were seen at the
      roundhouse gate addressing the shopmen before the whistle had finished, is to our mind a plain
      story: the strikers were misled by outside agitators who have nothing to lose here and will be
      gone before the first pay is missed. We counsel the men to return. The Company has given its
      word that no man who resumes work on Monday will be marked for it. Those who refuse will have
      only themselves, and their new friends, to thank for what follows. Trade in the town is already
      suffering; the grocers report accounts going unpaid. Let the men consider who it is that bears
      the cost.
  - ref: wrenfield-psr-u1-6#unit-2
    title: "Wrenfield Primary Source Reader, unit 2: Claims, evidence, inference (invented)"
    text: >
      A claim is something a source asserts about the world: "the strikers were misled." Evidence is
      what a source shows or reports that a reader could check against other sources: a date, a name,
      a thing seen. An inference is a step a reader takes from evidence toward a claim; it belongs to
      the reader, not to the document. The three are easy to confuse because sources rarely label
      them. An editorial presents its claims in the voice of fact; a letter reports what its author
      saw and what its author concluded in the same sentence. When you read, sort each statement: is
      this something the author observed or could have observed, something the author was told, or
      something the author concluded? Then ask what the author would have needed to see to support the
      claim, and whether the document shows it. A worksheet entry that treats an author's conclusion
      as evidence has skipped the sorting. Write the claim in the author's words, the evidence in
      yours, and mark the inference as your own.
