# --- Added 2026-11-01 for the CP-0001 model run. Status of this addition: design assumption.
# Every excerpt below is invented for the fictional Wrenfield University; none quotes a real document. ---
source_texts_status: design assumption
assignment_prompt: >
  HIST 210 weekly source-analysis worksheet, entry 6 (graded). Evaluate one primary source, packet excerpt C
  (Pruitt's letter of 28 July 1877), in about 150 words: whose perspective it gives, what it can show about the
  strike, and what it cannot show. Use the method in Reader unit 3.
source_texts:
  - ref: packet-1877-strike#C
    title: "Course packet excerpt C: letter from shop foreman E. Pruitt to the division superintendent, 28 July 1877 (invented)"
    text: >
      Sir,—I have the honor to report on the condition of the shops since Monday the 23rd. The men
      came in at the usual hour and worked until about eleven, when word came that the eastern
      freights had stopped at Marlow. A number of men left their benches to talk at the roundhouse
      gate, where two persons not in the Company's employ were speaking to them. By noon the shops
      were abandoned. I kept the fires banked with the help of the three watchmen and have done so
      since. I do not believe one man in five wished to strike. The ringleaders are Halloran, a
      brakeman who has no business in the shops at all, Reese of the machine shop, and Dunmore of the
      car shop; they have held the men together by meetings at the depot each evening. I am told the
      quieter men would return if assured against discharge. I have given no such assurance, having no
      authority to. The engines are safe. I will continue to report daily and await your instructions
      as to the watchmen's pay, which is now owing for the week. Your obedient servant, E. Pruitt,
      Foreman.
  - ref: wrenfield-psr-u1-6#unit-3
    title: "Wrenfield Primary Source Reader, unit 3: Reading against the grain (invented)"
    text: >
      Every document was made by someone, for someone, to do something. Reading with the grain means
      taking the document on its own terms: what does it say, what does it want its first reader to
      believe or do? Reading against the grain means asking what the document shows without meaning
      to. A foreman's report written to keep his position tells you about the strike, but it also
      tells you what a foreman thought his superintendent wanted to hear, which workers he knew by
      name, and which he did not. Begin by naming the author's position and interest. Then list what
      the author could see from that position and what was out of view. Then notice the words chosen
      where other words were available: "ringleaders" rather than "spokesmen," "abandoned" rather than
      "left." Finally, state what the document can show (the author's view, the vocabulary of
      authority, the names that were recorded) and what it cannot (the motives of the people
      described, what happened where the author was not). Evaluating a source is this two-column list,
      written in prose.
