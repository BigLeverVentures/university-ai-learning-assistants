# --- Added 2026-11-01 for the CP-0001 model run. Status of this addition: design assumption.
# Every excerpt below is invented for the fictional Wrenfield University; none quotes a real document. ---
source_texts_status: design assumption
assignment_prompt: >
  HIST 335 final project (assessed, 3,000-word narrative with annotated bibliography, 40% of the course grade).
  Choose one industrial city and, using Document Set A, write a narrative of housing conditions in one district
  between 1880 and 1890 as seen by inspectors, landlords, and residents. Each Set A document you use must appear
  in the annotated bibliography with a two-sentence annotation in your own words. Set B documents are for
  practice only and may not be cited.
source_texts:
  - ref: icds-a#A-7
    title: "Industrial Cities Document Set A, document A-7: report of the sanitary inspector to the Thornbury Board of Health on Mill Lane, 1884 (invented; assigned)"
    text: >
      To the Board of Health, Thornbury. Gentlemen,—Pursuant to your instruction of the 3rd I
      inspected the eleven dwellings on the north side of Mill Lane on the 9th and 10th instant. The
      houses are of two rooms each, back to back with Furnace Row, and have no through ventilation. I
      counted sixty-eight persons in the eleven houses, of whom twenty-nine are children under twelve.
      Water is drawn from a single standpipe at the lane end, running two hours each morning; the
      privies, three for the row, discharge to an open channel which was blocked at the time of my
      visit. Two cases of fever were reported to me by the occupants, neither attended by a medical
      man. The landlord's man of business, Mr. Coates, informed me that repairs are the tenants' affair under
      their agreements. I am of the opinion that the row is unfit for the number housed and that the
      channel is a danger to the lane and to Furnace Row beyond it. I recommend notice under the Act.
      The occupants were civil and anxious that nothing I wrote should cause them to lose their
      places. I have the honor to be, Gentlemen, your obedient servant, R. Fenwick, Inspector.
  - ref: icds-b#B-3
    title: "Industrial Cities Document Set B, document B-3: letter from a landlord to the Thornbury town council, 1886 (invented; non-assigned practice document)"
    text: >
      Gentlemen,—I write concerning the notice served on my property in Tanner's Court. I bought the
      court in 1879 as an investment for my daughters, and it has returned less than four per cent in
      any year since. The tenants are the class of person who will live anywhere; I have had families
      of nine in a single room against my express instruction. The court was built before the present
      by-laws and I cannot be expected to rebuild it to a standard the town did not require when it
      was put up. Your inspector found the drains stopped; they are stopped because the tenants throw
      refuse into them, and I have twice paid to have them cleared. If the Council wishes to see such
      courts closed, it should say where the people are to go and who is to pay for the houses they
      will need. I am willing to put in a second standpipe at my own cost if the Council will withdraw
      the notice. I am, Gentlemen, your obedient servant, G. Ambrose, Esq.
