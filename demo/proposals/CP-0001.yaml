test_plan_run3:
  run: CP-0001-run3
  repeats: 10
  assemblies:
    baseline:
      - out/assemblies/asm-U-0001.json
      - out/assemblies/asm-H1-0001.json
      - out/assemblies/asm-H2-0001.json
      - out/assemblies/asm-S1-0001.json
    candidates:
      rc1:
        - out/assemblies/asm-H1-0002.json
        - out/assemblies/asm-H2-0002.json
      rc2:
        - out/assemblies/asm-H1-0005.json
        - out/assemblies/asm-H2-0003.json
      rc3:
        - out/assemblies/asm-H1-0006.json
        - out/assemblies/asm-H2-0004.json
  scenario_sets:
    - set: target-family
      scenarios: [SC-H-004]
      profiles: [SP-persist-confused]
      run_on: all                            # 10 assemblies x 1 profile x 10 = 100 cells
  calibration:
    faculty_reviewers: ["Dr. Okafor (HIST 210)", "Dr. Lindqvist (HIST 335)"]
    sample: stratified by scenario x profile, 1 cell per stratum per arm (design assumption)
    agreement_metric: percent agreement and Cohen's kappa per rubric dimension
analysis_run3:                               # rules fixed before any run-3 model call
  primary_dimension: D2P1
  confusion_profiles: [SP-persist-confused]
  d2_fail_max: 0.50                          # band: pass >= target_family_pass_rate_min (0.80), fail <= 0.50, else indeterminate; fewer than min_valid valid -> "insufficient valid judgments"
  min_valid: 3
  expected_bands:
    asm-H1-0001: fail
    asm-H2-0001: fail
    asm-U-0001: pass
    asm-S1-0001: pass
    candidate-rc2: pass                      # both rc2 assemblies
    candidate-rc3: pass                      # both rc3 assemblies
  rc1_clause: holds if each rc1 assembly's D2P1 band is pass; did not hold if either is fail; otherwise (indeterminate, judge disagreement, insufficient valid judgments, no executed cells) indeterminate
  missing_assembly: a planned assembly with no executed cells gets the band "insufficient valid judgments"; it can only prevent "held", and a contradicting band elsewhere in the clause still decides "did not hold"
  judging:
    passes: 2                                # pass A at run time (judgment_v1 after the second pass), pass B via run.py --rejudge; same prompt (version 2), model and settings
    merge: per dimension, invalid on either side -> invalid; equal labels -> that label; n-a against pass or fail, or pass against fail -> flag
    flag: excluded from every rate and counted per dimension and per assembly; every rate is shown as a range (flags counted as fail / as pass); a band is given only when both ends fall in the same band, else "indeterminate (judge disagreement)"
  caption_rule: Table 8d's caption reads "confirmed by run 3" only if the target clause holds under the combined judgment and under each pass alone; anything else "not confirmed by run 3". It covers the persistently confused separation at N = 1 on this profile only, not the rc1 clause and not Table 8d's other columns.
  descriptive_only:
    - the first-explanation turn table (profile stop check) for all ten assemblies
    - D2P1 pass rate beside the stop check's turn-1 share, per assembly
    - cells whose first confusion signal, as the D2P1 judgment cites it (the smallest turn in its turns, per pass), is not turn 1
    - run 2's merged D2P (N = 2) on this profile beside run 3's D2P1; run 2 is not re-scored under N = 1

