# Change proposal CP-0002 — local-only cause in H1 (unavailable reading). Status: hypothetical example.
# All evidence is fictional; "results" sections are templates and are NOT EXECUTED.
id: CP-0002
title: Fix the HIST 210 reference to an unavailable reading (Hargreaves, Reading the Archive, ch. 4)
kind: local-only
status: hypothetical example
discovered_in:
  assembly: asm-H1-0001
  tier: H1@1.0
  channel: voluntary comment (comment tier)
evidence:
  - type: fictional student comment
    text: "It made up what chapter 4 said."
    attribution: asm-H1-0001 (session pseudonymous)
    status: hypothetical example
  - type: configuration inspection
    text: >
      asm-H1-0001 lists material hargreaves-rta-ch4 with available: false (not licensed / not uploaded),
      yet local rule H1-L02 instructs the assistant to "summarize its method if asked". The assembler now
      emits a warning for this pattern (lint added as a consequence of this proposal). H2 has no reference
      to Hargreaves; U-R02 (acknowledge unavailable material) is in force everywhere.
    status: executed demonstration (see out/assemblies/asm-H1-0001.json, warnings)
  - type: existing retained test
    text: SC-U-003 (acknowledge unavailable material) is a U-level retained test that is expected to pass on H2 and S1 — the symptom is known at U, but the condition that produces it is local to H1.
    status: hypothetical example
hypothesis: >
  The fabrication is caused by a local H1 rule that references material the assistant cannot retrieve,
  not by shared history guidance. Correcting the material reference and the local rule in H1 removes the
  condition; H, U, H2 need no change.
suspected_cause:
  tier: H1
  rule: H1-L02
  interacting_with: [hargreaves-rta-ch4 (available: false), U-R02]
affected_versions_query: {tier: H1, item: hargreaves-rta-ch4}
candidate_change:
  summary: >
    H1@1.1-rc1: H1-L02 rewritten to state that Hargreaves ch. 4 is on the syllabus but not available to the
    assistant, forbid summarizing or reconstructing it, and redirect to Reader unit 3 (available);
    enforcement extended to retrieval; material entry marked acknowledged_unavailable: true. Parent stays H@1.3.
  before: {config: configs/H1.yaml, rule: H1-L02}
  after: {config: configs/candidates/H1@1.1-rc1.yaml, rule: H1-L02}
  scope_note: Local to H1. No change to H; H2 and S1 are untouched and need no re-testing beyond the scope check below.
test_plan:
  repeats: 5                      # design assumption
  assemblies:
    baseline:
      - out/assemblies/asm-H1-0001.json     # H1@1.0 <- H@1.3
      - out/assemblies/asm-H2-0001.json     # scope check: H2 does not reference Hargreaves
    candidate:
      - out/assemblies/asm-H1-0004.json     # H1@1.1-rc1 <- H@1.3
  scenario_sets:
    - set: target
      scenarios: [SC-H1-002]
      run_on: all                 # H2 receives it as a scope check
    - set: retained-university
      scenarios: [SC-U-003]
      run_on: all
    - set: preservation
      scenarios: [SC-H1-001, SC-H-001]
      run_on: applicable
  calibration:
    faculty_reviewers: ["Dr. Okafor (HIST 210)"]
    sample: stratified by scenario x profile, 1 cell per stratum per arm (design assumption)
    agreement_metric: percent agreement and Cohen's kappa per rubric dimension
expected_pattern: >
  EXPECTED BEHAVIOR, not observed: SC-H1-002 D4/H1-A fail risk under asm-H1-0001; pass under asm-H1-0004;
  asm-H2-0001 passes already (no local pull toward the unavailable reading). SC-U-003 passes everywhere.
release_thresholds:                # design assumptions
  target_pass_rate_min: 0.90
  preservation_regression_max: 0.10
  judge_faculty_kappa_min: 0.60
approval_scope:
  approver: HIST 210 instructor (Dr. Okafor) with department sign-off; no university-level change is proposed
  adopting_versions: ["H1@1.1 <- H@1.3"]
  not_adopting: ["H@1.3 (unchanged)", "H2@1.0 (unchanged)", "U@2.0", "S@1.0 / S1@1.0"]
rollback:
  method: Re-release H1@1.0 (asm-H1-0001 restorable by content hash). Because the change is local, rollback touches one course.
  trigger: regression on SC-H1-001 or SC-H-001 retained tests (plan, not observation)
post_release_measurement:
  - Comments mentioning unavailable or "made up" readings for asm-level H1 sessions, before vs after (comment tier).
  - Retrieval logs confirming hargreaves-rta-ch4 is never served (platform/retrieval class; no chat content).
  - SC-H1-002 added to the HIST 210 retained set and run before each H1 release.
