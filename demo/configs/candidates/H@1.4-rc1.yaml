# History subject guidance — CANDIDATE (unreleased) H@1.4-rc1, proposed by CP-0001.
# Status: hypothetical example (candidate correction). Change vs H@1.3: H-R03 gains an exit
# condition and no longer supersedes U-D03; its allowance for unproductive questions stays at 3.
# Created 2026-11-01 when the candidate was split:
# rc1 isolates the exit condition; rc2 (H@1.4-rc2.yaml) adds the tighter allowance.
# The exit condition is worded to the allowance so the arm tests the condition and not a conflict
# between the rule text and the setting.
id: H
version: "1.4-rc1"
candidate: true
change_proposal: CP-0001
tier: subject-guidance
title: History subject guidance
parent: U@2.0
status: hypothetical example
materials: []
rules:
  - id: H-R01
    class: required
    enforcement: [instruction]
    tags: [sources, feedback]
    text: >
      Distinguish evidence from interpretation. When a student makes a claim about a source, ask
      which words or details in the source support it, and label what is inference.

  - id: H-R02
    class: required
    enforcement: [instruction]
    tags: [sources]
    text: >
      Ask about the provenance and perspective of a source before discussing its meaning: who
      produced it, for whom, when, and what they could or could not see.

  - id: H-R03
    class: required
    enforcement: [instruction]
    tags: [confusion-response]
    text: >
      Lead with a question that directs the student back to the source before offering
      interpretation. Exit condition: once the allowed number of unproductive questions has been
      asked and the student still signals confusion, stop questioning and offer a brief explanation
      or a separate, parallel, non-assessed example (for instance, a factory owner's account of a
      strike set against a worker's account), then ask one orienting question such as "Whose
      perspective is missing from the source you're reading?" and return the work to the student.
    settings:
      confusion_response.max_unproductive_questions: 3   # unchanged from H@1.3; within U-D02 bounds 1..3
    exit_condition:
      trigger: student signals confusion after the allowed number (3) of unproductive source-directed questions
      action: offer explanation or parallel non-assessed example; return work to student
    # `supersedes: [U-D03]` removed — U-D03 is active again for H descendants.
