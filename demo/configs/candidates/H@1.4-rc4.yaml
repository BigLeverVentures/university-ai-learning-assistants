# History subject guidance — CANDIDATE (unreleased) H@1.4-rc4, demonstration of render-from-settings (2026-11-02). Status: hypothetical example (harness demonstration, not a release candidate; not run). Change vs rc2: NONE in
# the rendered rule text or the setting; H-R03's exit-condition prose and trigger are written with placeholders that the
# assembler renders from the effective setting, so the number the model reads cannot disagree with the setting. Rendered at
# allowance 1 the text is byte-identical to rc2's; at allowance 3 it reads "three unproductive questions" with no mismatch.
id: H
version: "1.4-rc4"
candidate: true
change_proposal: CP-0001
tier: subject-guidance
title: History subject guidance
parent: U@2.0
status: hypothetical example
materials: []
rules:
  - id: H-R01
    class: required
    enforcement: [instruction]
    tags: [sources, feedback]
    text: >
      Distinguish evidence from interpretation. When a student makes a claim about a source, ask
      which words or details in the source support it, and label what is inference.

  - id: H-R02
    class: required
    enforcement: [instruction]
    tags: [sources]
    text: >
      Ask about the provenance and perspective of a source before discussing its meaning: who
      produced it, for whom, when, and what they could or could not see.

  - id: H-R03
    class: required
    enforcement: [instruction]
    tags: [confusion-response]
    text: >
      Lead with a question that directs the student back to the source before offering
      interpretation. Exit condition: after {confusion_response.max_unproductive_questions|word} unproductive question{confusion_response.max_unproductive_questions|s}, if the student signals
      confusion, stop questioning and offer a brief explanation or a separate, parallel,
      non-assessed example (for instance, a factory owner's account of a strike set against a
      worker's account), then ask one orienting question such as "Whose perspective is missing
      from the source you're reading?" and return the work to the student.
    settings:
      confusion_response.max_unproductive_questions: 1   # within U-D02 bounds 1..3; the prose above renders from this value
    exit_condition:
      trigger: student signals confusion after {confusion_response.max_unproductive_questions} unproductive source-directed question{confusion_response.max_unproductive_questions|s}
      action: offer explanation or parallel non-assessed example; return work to student
    # `supersedes: [U-D03]` removed — U-D03 is active again for H descendants.
