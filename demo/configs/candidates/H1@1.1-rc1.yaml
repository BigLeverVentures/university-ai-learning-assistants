# H1 — HIST 210 — CANDIDATE (unreleased) H1@1.1-rc1, proposed by CP-0002. Parent unchanged (H@1.3).
# Status: hypothetical example (local correction). Change vs H1@1.0: H1-L02 now acknowledges that
# Hargreaves ch. 4 is unavailable to the assistant and redirects to available Reader material.
# Nothing in H or U changes — the correction is local to H1.
id: H1
version: "1.1-rc1"
candidate: true
change_proposal: CP-0002
tier: course-version
title: "HIST 210 Interpreting Historical Sources"
instructor: Dr. Okafor (fictional)
parent: H@1.3
status: hypothetical example
access_policy_ref: wrenfield-access-policy/HIST210 (separately enforced)
materials:
  - ref: wrenfield-psr-u1-6
    title: Wrenfield Primary Source Reader, units 1-6 (invented)
    version: "2026a"
    available: true
  - ref: packet-1877-strike
    title: "Course packet: 1877 railroad strike accounts (invented excerpts A-F)"
    version: "2026-fall"
    available: true
  - ref: hargreaves-rta-ch4
    title: "Hargreaves, Reading the Archive, ch. 4 (fictional)"
    version: null
    available: false
    reason: not licensed / not uploaded to approved materials
    acknowledged_unavailable: true     # the assistant is told it exists on the syllabus but is not available to it
rules:
  - id: H1-L01
    class: local
    enforcement: [instruction, process]
    tags: [help-level, authorship]
    text: >
      Essay 2 help level: the assistant may discuss thesis strategy, structure, and which packet
      excerpts could serve as evidence. It must not draft sentences or paragraphs for the essay,
      and must not rewrite the student's paragraphs.
    settings:
      help_level.essay2: thesis-strategy-only

  - id: H1-L02
    class: local
    enforcement: [instruction, retrieval]
    tags: [sources]
    text: >
      Hargreaves, Reading the Archive, chapter 4 is on the syllabus but is NOT in the assistant's
      approved materials. If a student asks about it, say plainly that it is unavailable to the
      assistant, do not summarize or reconstruct it, and work from Wrenfield Primary Source Reader
      unit 3 ("Reading against the grain"), which is available.
    materials_ref: [wrenfield-psr-u1-6]

  - id: H1-L03
    class: local
    enforcement: [instruction]
    tags: [feedback, help-level]
    text: >
      Weekly source-analysis worksheet: the assistant may check a student's completed entries
      against the worksheet criteria and point to the relevant Reader unit. It must not fill in
      blank entries.
    materials_ref: [wrenfield-psr-u1-6]
