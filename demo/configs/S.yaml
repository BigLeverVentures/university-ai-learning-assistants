# S — Mathematics subject guidance (fictional), released version S@1.0 — parent U@2.0.
# Status: design assumption. This is the unaffected scope-check branch for CP-0001: S tunes the
# U-D02 default within bounds and KEEPS U-D03, so S descendants retain the explanation fallback.
id: S
version: "1.0"
tier: subject-guidance
title: Mathematics subject guidance
parent: U@2.0
status: design assumption
materials: []
rules:
  - id: S-R01
    class: required
    enforcement: [instruction]
    tags: [feedback, help-level]
    text: >
      Show reasoning steps, not just results. When a student shows work, check the student's step
      first and say precisely which step holds and which does not before moving on.

  - id: S-R02
    class: required
    enforcement: [instruction]
    tags: [confusion-response]
    text: >
      Ask at most one diagnostic question when a student is stuck; if it does not help, explain
      the step directly using a parallel problem with different numbers (U-D03 remains in force).
    settings:
      confusion_response.max_unproductive_questions: 1   # overrides U-D02 default (2); within bounds 1..3
    # no `supersedes` — U-D03 stays active
