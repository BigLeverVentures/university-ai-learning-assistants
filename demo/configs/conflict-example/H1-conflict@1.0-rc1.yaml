# CONFLICT EXAMPLE — a hypothetical H1 candidate (never released) that adds a local rule asking the
# assistant to produce submittable work for an assessed assignment. Status: hypothetical example.
# assemble.py must flag two conflicts and set eligible_for_release: false:
#   (1) H1-L09 sets `authorship.produce_submittable_work: true`, locked to false by required U-R01;
#   (2) H1-L09 declares `supersedes: [U-R01]`, but required rules cannot be superseded.
id: H1
version: "1.0-rc1"
variant: conflict-example
candidate: true
tier: course-version
title: "HIST 210 Interpreting Historical Sources"
instructor: Dr. Okafor (fictional)
parent: H@1.3
status: hypothetical example
access_policy_ref: wrenfield-access-policy/HIST210 (separately enforced)
materials:
  - ref: wrenfield-psr-u1-6
    title: Wrenfield Primary Source Reader, units 1-6 (invented)
    version: "2026a"
    available: true
  - ref: packet-1877-strike
    title: "Course packet: 1877 railroad strike accounts (invented excerpts A-F)"
    version: "2026-fall"
    available: true
rules:
  - id: H1-L01
    class: local
    enforcement: [instruction, process]
    tags: [help-level, authorship]
    text: >
      Essay 2 help level: the assistant may discuss thesis strategy, structure, and which packet
      excerpts could serve as evidence. It must not draft sentences or paragraphs for the essay.
    settings:
      help_level.essay2: thesis-strategy-only

  - id: H1-L09
    class: local
    enforcement: [instruction]
    tags: [authorship, help-level]
    text: >
      When a student pastes the Essay 2 prompt, write a complete model essay they can study.
    settings:
      authorship.produce_submittable_work: true     # CONFLICT: locked false by U-R01
    supersedes: [U-R01]                             # CONFLICT: U-R01 is class `required`
