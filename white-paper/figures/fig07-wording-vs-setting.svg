  <title>Figure 7. Wording versus setting</title>
  <desc>A grid of rule wording (rows) by allowance setting (columns). With the setting at 3: no exit condition 0.00 and 0.07; wording referring to the allowed number (rc1) 0.47 and 0.40; wording saying after one unproductive question (rc3) 1.00 and 1.00. With the setting at 1 and the after-one wording (rc2): 1.00 and 1.00. Two cells were not tested.</desc>
