<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" width="1800" height="760" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 1. The stage of this work</title>
  <desc>Four stages left to right: articles (complete), this white paper (this document), synthetic student design (next), and partner implementation (beyond this paper). A dashed line marks where implementation begins, between stages 3 and 4.</desc>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2A3A"/></marker><marker id="arrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F6B"/></marker></defs>
  <rect width="1800" height="760" fill="#F7F3EA"/>
  <text x="60" y="70" font-size="40" fill="#0F2A3A" font-weight="bold">The stage of this work</text>
  <text x="60" y="112" font-size="23" fill="#5B6770">A white paper is not an implementation. Each stage tests what the one before it could only propose.</text>
  <rect x="60" y="190" width="380" height="400" rx="14" fill="#FFFFFF" stroke="#A9B1B6" stroke-width="2"/><path d="M74,190 H70 V590 H74 A14,14 0 0 1 60,576 V204 A14,14 0 0 1 74,190 Z" fill="#5B6770"/>
  <circle cx="110" cy="242" r="20" fill="#5B6770"/>
  <text x="110" y="250" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1</text>
  <text x="142" y="251" font-size="24" fill="#0F2A3A" font-weight="bold">Articles</text>
  <text x="94" y="310" font-size="21" fill="#0F2A3A">Worked out the argument:</text>
  <text x="94" y="344" font-size="21" fill="#0F2A3A">university-first teaching,</text>
  <text x="94" y="378" font-size="21" fill="#0F2A3A">nested customization,</text>
  <text x="94" y="412" font-size="21" fill="#0F2A3A">feedback and improvement</text>
  <rect x="94" y="528" width="118" height="36" rx="18" fill="#F7F3EA" stroke="#5B6770" stroke-width="2"/>
  <text x="153.0" y="553" font-size="19" fill="#0F2A3A" font-weight="bold" text-anchor="middle">Complete</text>
  <path d="M446,390.0 L481,390.0" stroke="#0F2A3A" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="487" y="190" width="380" height="400" rx="14" fill="#E3EFEE" stroke="#1F6F6B" stroke-width="2"/><path d="M501,190 H497 V590 H501 A14,14 0 0 1 487,576 V204 A14,14 0 0 1 501,190 Z" fill="#1F6F6B"/>
  <circle cx="537" cy="242" r="20" fill="#1F6F6B"/>
  <text x="537" y="250" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">2</text>
  <text x="569" y="251" font-size="24" fill="#0F2A3A" font-weight="bold">This white paper</text>
  <text x="521" y="310" font-size="21" fill="#0F2A3A">Reference architecture;</text>
  <text x="521" y="344" font-size="21" fill="#0F2A3A">executable mechanics;</text>
  <text x="521" y="378" font-size="21" fill="#0F2A3A">four exploratory dry runs</text>
  <text x="521" y="412" font-size="21" fill="#0F2A3A">(one model, scripted</text>
  <text x="521" y="446" font-size="21" fill="#0F2A3A">students, invented courses)</text>
  <rect x="521" y="528" width="176" height="36" rx="18" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="2"/>
  <text x="608.75" y="553" font-size="19" fill="#1F6F6B" font-weight="bold" text-anchor="middle">This document</text>
  <path d="M873,390.0 L908,390.0" stroke="#0F2A3A" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="914" y="190" width="380" height="400" rx="14" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="2" stroke-dasharray="8 6"/><path d="M928,190 H924 V590 H928 A14,14 0 0 1 914,576 V204 A14,14 0 0 1 928,190 Z" fill="#1F6F6B"/>
  <circle cx="964" cy="242" r="20" fill="#1F6F6B"/>
  <text x="964" y="250" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">3</text>
  <text x="996" y="251" font-size="24" fill="#0F2A3A" font-weight="bold">Synthetic student design</text>
  <text x="948" y="310" font-size="21" fill="#0F2A3A">Validated library of</text>
  <text x="948" y="344" font-size="21" fill="#0F2A3A">model-driven students;</text>
  <text x="948" y="378" font-size="21" fill="#0F2A3A">more scenarios, disciplines;</text>
  <text x="948" y="412" font-size="21" fill="#0F2A3A">calibrated instruments;</text>
  <text x="948" y="446" font-size="21" fill="#0F2A3A">model and deployment design</text>
  <rect x="948" y="528" width="72" height="36" rx="18" fill="#F7F3EA" stroke="#1F6F6B" stroke-width="2"/>
  <text x="984.0" y="553" font-size="19" fill="#1F6F6B" font-weight="bold" text-anchor="middle">Next</text>
  <path d="M1300,390.0 L1335,390.0" stroke="#0F2A3A" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="1341" y="190" width="380" height="400" rx="14" fill="#FFFFFF" stroke="#5B6770" stroke-width="2"/><path d="M1355,190 H1351 V590 H1355 A14,14 0 0 1 1341,576 V204 A14,14 0 0 1 1355,190 Z" fill="#5B6770"/>
  <circle cx="1391" cy="242" r="20" fill="#5B6770"/>
  <text x="1391" y="250" font-size="22" fill="#FFFFFF" font-weight="bold" text-anchor="middle">4</text>
  <text x="1423" y="251" font-size="24" fill="#0F2A3A" font-weight="bold">Partner implementation</text>
  <text x="1375" y="310" font-size="21" fill="#0F2A3A">Institution's own model;</text>
  <text x="1375" y="344" font-size="21" fill="#0F2A3A">faculty rulings, calibration;</text>
  <text x="1375" y="378" font-size="21" fill="#0F2A3A">privacy determinations;</text>
  <text x="1375" y="412" font-size="21" fill="#0F2A3A">limited real-student pilot;</text>
  <text x="1375" y="446" font-size="21" fill="#0F2A3A">implementation guide</text>
  <rect x="1375" y="528" width="222" height="36" rx="18" fill="#F7F3EA" stroke="#5B6770" stroke-width="2"/>
  <text x="1485.75" y="553" font-size="19" fill="#0F2A3A" font-weight="bold" text-anchor="middle">Beyond this paper</text>
  <line x1="1317.5" y1="150" x2="1317.5" y2="618" stroke="#B5651D" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="1305.5" y="172" font-size="19" fill="#B5651D" font-weight="bold" text-anchor="end">the bright line: implementation begins here</text>
  <text x="60" y="650" font-size="21" fill="#0F2A3A">Stages 1–3 use invented courses and synthetic students only. Real students, faculty rulings and an institution's data enter at stage 4.</text>
  <line x1="60" y1="690" x2="1740" y2="690" stroke="#D9D3C7" stroke-width="1"/>
  <text x="60" y="726" font-size="20" fill="#5B6770" font-style="italic">Reference design; the stage plan of this work, not an institutional timeline.</text>
</svg>
