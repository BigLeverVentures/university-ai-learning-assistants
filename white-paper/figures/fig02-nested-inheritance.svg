<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1130" width="1800" height="1130" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Figure 2. Nested instructional inheritance</title>
  <desc>Tree of configuration tiers for fictional Wrenfield University: university foundation U at top, subject guidance H (History) and S (Mathematics) beneath, course versions H1, H2 under H and S1 under S. Solid arrows show inheritance; an approved shared change H@1.3 to H@1.4 propagates to H1 and H2 only; a local addition H1-L03 stays in H1 and cannot rewrite its parent; evidence travels up a separate dashed path to proposal, test and university approval. Inheritance grants no access to student records.</desc>
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F2A3A"/></marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6F6B"/></marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6770"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B5651D"/></marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9C3D3D"/></marker>
  </defs>
  <rect width="1800" height="1130" fill="#F7F3EA"/>

  <!-- Header -->
    <text x="60" y="66" font-size="38" fill="#0F2A3A" font-weight="bold">Nested instructional inheritance</text>
    <text x="60" y="106" font-size="23" fill="#5B6770">Shared changes travel down; local additions stay local.</text>

  <!-- Tier boxes -->
    <g >
    <rect x="480" y="170" width="480" height="110" rx="14" fill="#FFFFFF" stroke="#0F2A3A" stroke-width="2"/>
    <path d="M494,170 H490 V280 H494 A14,14 0 0 1 480,266 V184 A14,14 0 0 1 494,170 Z" fill="#1F6F6B"/>
    </g>
    <text x="516" y="207" font-size="24" fill="#0F2A3A" font-weight="bold">U — University learning foundation</text>
    <text x="516" y="237" font-size="20" fill="#5B6770">Wrenfield University · U@2.0</text>
    <text x="516" y="264" font-size="20" fill="#5B6770">required and default rules; locked settings</text>
    <g >
    <rect x="230" y="380" width="420" height="130" rx="14" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="3"/>
    <path d="M244,380 H240 V510 H244 A14,14 0 0 1 230,496 V394 A14,14 0 0 1 244,380 Z" fill="#1F6F6B"/>
    </g>
    <text x="266" y="416" font-size="24" fill="#0F2A3A" font-weight="bold">H — History subject guidance</text>
    <text x="266" y="445" font-size="20" fill="#5B6770">parent: U · owns rule H-R03</text>
    <rect x="266" y="460" width="390.859375" height="31" rx="15.5" fill="#E3EFEE" stroke="#1F6F6B" stroke-width="1.5"/>
    <text x="461.4296875" y="481.98" font-size="18" fill="#1F6F6B" font-weight="bold" text-anchor="middle">H@1.3 → H@1.4: approved shared change</text>
  <g opacity="0.55">
    <g >
    <rect x="790" y="380" width="420" height="130" rx="14" fill="#FFFFFF" stroke="#5B6770" stroke-width="2"/>
    <path d="M804,380 H800 V510 H804 A14,14 0 0 1 790,496 V394 A14,14 0 0 1 804,380 Z" fill="#5B6770"/>
    </g>
    <text x="826" y="416" font-size="24" fill="#0F2A3A" font-weight="bold">S — Mathematics guidance</text>
    <text x="826" y="445" font-size="20" fill="#5B6770">subject guidance · parent: U · S@1.0</text>
    <text x="826" y="474" font-size="20" fill="#5B6770" font-style="italic">unaffected by H@1.4</text>
  </g>
    <g >
    <rect x="90" y="620" width="330" height="130" rx="14" fill="#E3EFEE" stroke="#1F6F6B" stroke-width="3"/>
    <path d="M104,620 H100 V750 H104 A14,14 0 0 1 90,736 V634 A14,14 0 0 1 104,620 Z" fill="#1F6F6B"/>
    </g>
    <text x="126" y="655" font-size="24" fill="#0F2A3A" font-weight="bold">H1 — HIST 210</text>
    <text x="126" y="683" font-size="20" fill="#0F2A3A">Interpreting Historical Sources</text>
    <text x="126" y="710" font-size="18" fill="#5B6770">parent: H · H1@1.0 · Dr. Okafor</text>
    <g >
    <rect x="480" y="620" width="330" height="130" rx="14" fill="#E3EFEE" stroke="#1F6F6B" stroke-width="3"/>
    <path d="M494,620 H490 V750 H494 A14,14 0 0 1 480,736 V634 A14,14 0 0 1 494,620 Z" fill="#1F6F6B"/>
    </g>
    <text x="516" y="655" font-size="24" fill="#0F2A3A" font-weight="bold">H2 — HIST 335</text>
    <text x="516" y="683" font-size="20" fill="#0F2A3A">Industrial Cities, 1850–1920</text>
    <text x="516" y="710" font-size="18" fill="#5B6770">parent: H · H2@1.0 · Dr. Lindqvist</text>
  <g opacity="0.55">
    <g >
    <rect x="835" y="620" width="330" height="130" rx="14" fill="#FFFFFF" stroke="#5B6770" stroke-width="2"/>
    <path d="M849,620 H845 V750 H849 A14,14 0 0 1 835,736 V634 A14,14 0 0 1 849,620 Z" fill="#5B6770"/>
    </g>
    <text x="871" y="655" font-size="24" fill="#0F2A3A" font-weight="bold">S1 — MATH 120</text>
    <text x="871" y="683" font-size="20" fill="#0F2A3A">Introductory Statistics</text>
    <text x="871" y="710" font-size="18" fill="#5B6770">parent: S · S1@1.0 · Dr. Mehta</text>
  </g>

  <!-- Inheritance arrows (solid, downward) -->
    <path d="M720,280 L720,330 L440,330 L440,378" fill="none" stroke="#0F2A3A" stroke-width="2.5" marker-end="url(#arr-navy)" stroke-linejoin="round"/>
    <text x="452" y="366" font-size="20" fill="#5B6770">inherits</text>
    <path d="M720,280 L720,330 L1000,330 L1000,378" fill="none" stroke="#0F2A3A" stroke-width="2.5" marker-end="url(#arr-navy)" opacity="0.55" stroke-linejoin="round"/>
    <text x="1012" y="366" font-size="20" fill="#5B6770" opacity="0.55">inherits</text>
    <path d="M1000,510 L1000,618" fill="none" stroke="#5B6770" stroke-width="2.5" marker-end="url(#arr-gray)" opacity="0.55" stroke-linejoin="round"/>
    <text x="1012" y="570" font-size="20" fill="#5B6770" opacity="0.55">inherits</text>

  <!-- Highlighted propagation of the approved change H@1.4 to H1 and H2 -->
    <path d="M290,510 L290,618" fill="none" stroke="#1F6F6B" stroke-width="5" marker-end="url(#arr-teal)" stroke-linejoin="round"/>
    <text x="278" y="560" font-size="20" fill="#5B6770" text-anchor="end">inherits</text>
    <text x="278" y="584" font-size="20" fill="#1F6F6B" font-weight="bold" text-anchor="end">H@1.4 propagates</text>
    <path d="M600,510 L600,618" fill="none" stroke="#1F6F6B" stroke-width="5" marker-end="url(#arr-teal)" stroke-linejoin="round"/>
    <text x="612" y="560" font-size="20" fill="#5B6770">inherits</text>
    <text x="612" y="584" font-size="20" fill="#1F6F6B" font-weight="bold">H@1.4 propagates</text>

  <!-- Local addition on H1: cannot rewrite the parent -->
    <rect x="134.1328125" y="734" width="241.734375" height="31" rx="15.5" fill="#FFFFFF" stroke="#B5651D" stroke-width="1.5"/>
    <text x="255.0" y="755.98" font-size="18" fill="#B5651D" font-weight="bold" text-anchor="middle">H1-L03: local, stays local</text>
    <path d="M370,620 L370,516" fill="none" stroke="#B5651D" stroke-width="2.5" marker-end="url(#arr-amber)" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <line x1="359" y1="556" x2="381" y2="578" stroke="#B5651D" stroke-width="4"/>
    <line x1="359" y1="578" x2="381" y2="556" stroke="#B5651D" stroke-width="4"/>
    <text x="392" y="562" font-size="20" fill="#B5651D" font-style="italic">does not rewrite</text>
    <text x="392" y="586" font-size="20" fill="#B5651D" font-style="italic">parent</text>

  <!-- Evidence path (dashed): course version to proposal, test, approval -->
    <g >
    <rect x="1240" y="300" width="500" height="300" rx="14" fill="#FFFFFF" stroke="#1F6F6B" stroke-width="2" stroke-dasharray="10 7"/>
    <path d="M1254,300 H1250 V600 H1254 A14,14 0 0 1 1240,586 V314 A14,14 0 0 1 1254,300 Z" fill="#1F6F6B"/>
    </g>
    <text x="1274" y="342" font-size="24" fill="#0F2A3A" font-weight="bold">Evidence → proposal → test →</text>
    <text x="1274" y="373" font-size="24" fill="#0F2A3A" font-weight="bold">approval by the owning tier</text>
    <text x="1274" y="416" font-size="20" fill="#0F2A3A">Evidence is attributed to assembly records</text>
    <text x="1274" y="443" font-size="20" fill="#0F2A3A">(asm-H1-…), never to a bare tier.</text>
    <text x="1274" y="470" font-size="20" fill="#0F2A3A">Change proposal CP-0001 names the tier that</text>
    <text x="1274" y="497" font-size="20" fill="#0F2A3A">owns the cause: H.</text>
    <text x="1274" y="524" font-size="20" fill="#0F2A3A">Dry runs on U-only, H1, H2, S1 confirmed</text>
    <text x="1274" y="551" font-size="20" fill="#0F2A3A">the scope of the weakness.</text>
    <text x="1274" y="578" font-size="20" fill="#0F2A3A">Owners of H approve; released as H@1.4.</text>
    <path d="M90,700 L48,700 L48,820 L1490.0,820 L1490.0,602" fill="none" stroke="#1F6F6B" stroke-width="2.5" marker-end="url(#arr-teal)" stroke-dasharray="10 7" stroke-linejoin="round"/>
    <text x="560" y="808" font-size="20" fill="#1F6F6B" font-style="italic">evidence travels up; the course version does not edit its parent</text>

  <!-- Assembly note -->
    <rect x="90" y="860" width="760" height="84" rx="12" fill="#E3EFEE" stroke="#1F6F6B" stroke-width="1.5"/>
    <text x="116" y="894" font-size="22" fill="#0F2A3A" font-weight="bold">Assembled assistant for H1 = H1@1.0 + H@1.4 + U@2.0</text>
    <text x="116" y="924" font-size="19" fill="#5B6770">assembly record asm-H1-0005 · evidence from use is attributed to this record</text>

  <!-- Legend -->
    <path d="M90,985 L150,985" fill="none" stroke="#0F2A3A" stroke-width="2.5" marker-end="url(#arr-navy)" stroke-linejoin="round"/>
    <text x="162" y="992" font-size="20" fill="#0F2A3A">inherits</text>
    <path d="M290,985 L350,985" fill="none" stroke="#1F6F6B" stroke-width="5" marker-end="url(#arr-teal)" stroke-linejoin="round"/>
    <text x="362" y="992" font-size="20" fill="#0F2A3A">approved change propagates</text>
    <path d="M680,985 L740,985" fill="none" stroke="#1F6F6B" stroke-width="2.5" marker-end="url(#arr-teal)" stroke-dasharray="10 7" stroke-linejoin="round"/>
    <text x="752" y="992" font-size="20" fill="#0F2A3A">evidence / proposal</text>
    <path d="M990,985 L1050,985" fill="none" stroke="#B5651D" stroke-width="2.5" marker-end="url(#arr-amber)" stroke-dasharray="6 5" stroke-linejoin="round"/>
    <line x1="1012" y1="977" x2="1028" y2="993" stroke="#B5651D" stroke-width="3"/>
    <line x1="1012" y1="993" x2="1028" y2="977" stroke="#B5651D" stroke-width="3"/>
    <text x="1062" y="992" font-size="20" fill="#0F2A3A">blocked: local stays local</text>
    <rect x="1330" y="973" width="40" height="24" rx="6" fill="#FFFFFF" stroke="#5B6770" stroke-width="2" opacity="0.55"/>
    <text x="1382" y="992" font-size="20" fill="#0F2A3A">unaffected scope</text>
    <text x="90" y="1032" font-size="22" fill="#0F2A3A" font-weight="bold">Inheritance concerns guidance and configuration only — it grants no access to student records.</text>

  <!-- Caption strip -->
    <line x1="60" y1="1068" x2="1740" y2="1068" stroke="#9AA3A8" stroke-width="1"/>
    <text x="60" y="1102" font-size="20" fill="#5B6770" font-style="italic">Reference design; identifiers are illustrative (fictional Wrenfield University).</text>
</svg>
